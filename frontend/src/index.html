<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Resort OS</title>
  <meta name="description" content="Resort OS runs the front desk, rooms, restaurant, stores and staff of a resort.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eaf4f2">
  <!-- Theme (Light, Dark or Match my phone) and Solid panels, set before the app starts so the page never flashes
       the wrong theme. The same rules live in src/app/core/theme.ts. -->
  <script>
    (function () {
      var d = document.documentElement, t = 'system', solid = null;
      try { t = localStorage.getItem('ro-theme') || 'system'; solid = localStorage.getItem('ro-solid'); } catch (e) {}
      if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t);
      var dark = t === 'dark' || (t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.querySelector('meta[name=theme-color]').setAttribute('content', dark ? '#071a1f' : '#eaf4f2');
      // No graphics chip doing the drawing (the browser falls back to drawing in software): frosted glass is too slow.
      var softwareGl = function () {
        try {
          var g = document.createElement('canvas').getContext('webgl'), i = g && g.getExtension('WEBGL_debug_renderer_info');
          return !g || (!!i && /swiftshader|llvmpipe|software|basic render/i.test(g.getParameter(i.UNMASKED_RENDERER_WEBGL)));
        } catch (e) { return false; }
      };
      var lowPower = (navigator.deviceMemory && navigator.deviceMemory <= 4) ||
        (window.matchMedia && matchMedia('(prefers-reduced-transparency: reduce)').matches) || (solid === null && softwareGl());
      if (solid === 'on' || (solid === null && lowPower)) d.classList.add('ro-solid');
    })();
  </script>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Installable app (Sprint 18): the manifest, the home-screen icon on iPhones, and full-screen when installed. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Resort OS">
</head>
<body>
  <app-root></app-root>
</body>
</html>
