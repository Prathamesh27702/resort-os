<!-- ============ 1. System architecture ============ -->

  <text class="h" x="510" y="50">Edge</text>
  <rect class="zone" x="680" y="20" width="240" height="540" rx="10"/>

  <text class="t b" x="56" y="108">Resort staff</text>
  <text class="s" x="56" y="132">Reception, managers,</text>
  <text class="s" x="56" y="150">housekeeping, kitchen,</text>
  <text class="s" x="56" y="168">restaurant, drivers,</text>
  <text class="s" x="56" y="186">accountant, owner</text>
  <text class="xs" x="56" y="212">desktop · tablet · phone</text>

  <rect class="plan" x="40" y="380" width="170" height="110" rx="8"/>

  <!-- apps -->
  <rect class="built" x="270" y="80" width="180" height="150" rx="8"/>
  <text class="t b" x="286" y="108">Staff app</text>
  <text class="s" x="286" y="132">Angular 20, installable</text>
  <text class="s" x="286" y="150">(PWA). Shows only what</text>
  <text class="s" x="286" y="168">each role may use.</text>
  <text class="xs" x="286" y="212">Built · Sprints 1–2</text>

  <rect class="plan" x="270" y="380" width="180" height="110" rx="8"/>
  <text class="t b" x="286" y="408">Booking website</text>
  <text class="s" x="286" y="432">Live availability,</text>
  <text class="s" x="286" y="450">Razorpay checkout</text>
  <text class="xs" x="286" y="476">Planned · Sprint 27</text>

  <!-- edge -->
  <rect class="plan" x="505" y="200" width="140" height="170" rx="8"/>
  <text class="t b" x="521" y="228">Cloudflare</text>
  <text class="s" x="521" y="252">Domain, HTTPS,</text>
  <text class="s" x="521" y="270">firewall (WAF),</text>
  <text class="s" x="521" y="288">bot protection,</text>
  <text class="s" x="521" y="306">web-app hosting</text>
  <text class="xs" x="521" y="352">Go-live · Sprint 29</text>

  <!-- server -->
  <rect class="built" x="700" y="80" width="200" height="230" rx="8"/>
  <text class="t b" x="716" y="108">Resort.Api</text>
  <text class="s" x="716" y="130">ASP.NET Core · .NET 10</text>

  <line x1="716" y1="162" x2="884" y2="162" stroke="#DCE3E1"/>
  <text class="s" x="716" y="184">• sign-in and permissions</text>
  <text class="s" x="716" y="204">• business rules per module</text>
  <text class="s" x="716" y="224">• validation</text>
  <text class="s" x="716" y="244">• audit trail</text>
  <text class="s" x="716" y="264">• webhooks from partners</text>
  <text class="xs" x="716" y="294">Built · grows each sprint</text>

  <text class="s" x="976" y="350">Zoho Books / Tally</text>
  <text class="s" x="976" y="372">WhatsApp Business</text>
  <text class="s" x="976" y="394">Email provider</text>
  <text class="s" x="976" y="416">Channel manager → OTAs</text>

  <path class="arrow" d="M645,250 C 670,250 670,195 698,195"/>
  <path class="arrow" d="M900,125 L958,125"/>
  <path class="arrowp" d="M900,220 L958,220"/>
  <path class="arrowp" d="M900,420 L958,420"/>
  <path class="arrowp" d="M958,330 C 930,330 930,280 902,280"/>
  <text class="xs" x="904" y="266">webhooks</text>
  <path class="arrowp" d="M800,348 L800,312"/>

  <!-- legend -->

  <text class="s" x="274" y="605">Planned (sprint shown)</text>

</svg>

<!-- ============ 2. Backend layers ============ -->
<svg id="layers" width="1200" height="470" viewBox="0 0 1200 470">
  <rect width="1200" height="470" fill="#fff"/>
  <text class="h" x="30" y="40">Backend projects and the direction of dependencies</text>
  <g>
    <rect x="30" y="65" width="560" height="64" rx="8" fill="#0E3B43"/>
    <text class="t w b" x="50" y="93">Resort.Api</text>
    <text class="s w" x="50" y="114" style="fill:#D6E4E6">HTTP endpoints (thin), auth policies, error mapping, middleware</text>
    <rect x="30" y="149" width="560" height="64" rx="8" fill="#1F5560"/>
    <text class="t w b" x="50" y="177">Resort.Infrastructure</text>
    <text class="s w" x="50" y="198" style="fill:#D6E4E6">EF Core + PostgreSQL, SQL migrator, audit interceptor, JWT, hashing, adapters</text>
    <rect x="30" y="233" width="560" height="64" rx="8" fill="#2F6F7B"/>
    <text class="t w b" x="50" y="261">Resort.Application</text>
    <text class="s w" x="50" y="282" style="fill:#E3EEF0">Use-case services per module, validators, permission codes, business rules</text>
    <rect x="30" y="317" width="272" height="64" rx="8" fill="#5D8F98"/>
    <text class="t w b" x="50" y="345">Resort.Domain</text>
    <text class="s w" x="50" y="366" style="fill:#F0F6F7">Entities and rules, no frameworks</text>
    <rect x="318" y="317" width="272" height="64" rx="8" fill="#5D8F98"/>
    <text class="t w b" x="338" y="345">Resort.Contracts</text>
    <text class="s w" x="338" y="366" style="fill:#F0F6F7">Request / response shapes</text>
    <path class="arrow" d="M610,97 C 640,97 640,181 612,181"/>
    <path class="arrow" d="M610,181 C 640,181 640,265 612,265"/>
    <path class="arrow" d="M610,265 C 640,265 640,349 612,349"/>
    <text class="xs" x="650" y="183">depends on</text>
    <rect x="30" y="401" width="560" height="44" rx="8" fill="#F5F7F6" stroke="#DCE3E1"/>
    <text class="s" x="50" y="428">Resort.Tests: unit tests + integration tests against a real PostgreSQL 16</text>
  </g>
  <g>
    <text class="h" x="720" y="40">Inside each layer: one folder per module</text>
    <rect class="zone" x="720" y="65" width="450" height="380" rx="10"/>
    <text class="s" x="742" y="98">Application/</text>
    <text class="t" x="770" y="124">Identity/<tspan x="920">AuthService, UserService</tspan></text>
    <text class="t" x="770" y="150">Properties/<tspan x="920">PropertyService</tspan></text>
    <text class="t" x="770" y="176">Accommodation/<tspan x="920">AccommodationService,</tspan></text>
    <text class="t" x="920" y="196">BlockService</text>
    <text class="t" x="770" y="222">Audit/<tspan x="920">AuditQueryService</tspan></text>
    <text class="t" x="770" y="248">Guests/<tspan x="920">GuestService,</tspan></text>
    <text class="t" x="920" y="268">GuestDocumentService</text>
    <text class="t" x="770" y="294">Rates/<tspan x="920">RateService, PackageService</tspan></text>
    <text class="t" x="770" y="320" style="fill:#7A888B">Reservations/<tspan x="920">Sprint 05 …</tspan></text>
    <line x1="742" y1="336" x2="1150" y2="336" stroke="#DCE3E1"/>
    <text class="s" x="742" y="358">Rules that keep modules apart</text>
    <text class="s" x="742" y="378">• business rules live in Application/Domain only,</text>
    <text class="s" x="742" y="396">   never in endpoints or Angular screens</text>
    <text class="s" x="742" y="416">• a module reads another module through its service,</text>
    <text class="s" x="742" y="434">   never writes another module's tables</text>
  </g>
</svg>

<!-- ============ 3. Request pipeline ============ -->
<svg id="pipeline" width="1200" height="330" viewBox="0 0 1200 330">
  <rect width="1200" height="330" fill="#fff"/>
  <text class="h" x="30" y="36">What happens to every request, in order</text>
  <g font-size="13">
    <!-- row 1 -->
    <g transform="translate(30,60)">
      <rect width="150" height="78" rx="8" class="built"/><text class="t b" x="12" y="28">1 Request in</text><text class="s" x="12" y="50">HTTPS, behind</text><text class="s" x="12" y="66">proxy headers</text>
    </g>
    <g transform="translate(200,60)">
      <rect width="150" height="78" rx="8" class="built"/><text class="t b" x="12" y="28">2 Tracking ids</text><text class="s" x="12" y="50">correlation id and</text><text class="s" x="12" y="66">request id attached</text>
    </g>
    <g transform="translate(370,60)">
      <rect width="150" height="78" rx="8" class="built"/><text class="t b" x="12" y="28">3 Logging</text><text class="s" x="12" y="50">structured log line</text><text class="s" x="12" y="66">(Serilog)</text>
    </g>
    <g transform="translate(540,60)">
      <rect width="150" height="78" rx="8" class="built"/><text class="t b" x="12" y="28">4 Error handler</text><text class="s" x="12" y="50">one safe error shape,</text><text class="s" x="12" y="66">no internals leaked</text>
    </g>
    <g transform="translate(710,60)">
      <rect width="150" height="78" rx="8" class="built"/><text class="t b" x="12" y="28">5 Security headers</text><text class="s" x="12" y="50">HSTS, CSP, no-sniff,</text><text class="s" x="12" y="66">CORS allow-list</text>
    </g>
    <g transform="translate(880,60)">
      <rect width="150" height="78" rx="8" class="built"/><text class="t b" x="12" y="28">6 Who is it?</text><text class="s" x="12" y="50">JWT checked, plus</text><text class="s" x="12" y="66">security stamp</text>
    </g>
    <g transform="translate(1050,60)">
      <rect width="120" height="78" rx="8" class="built"/><text class="t b" x="12" y="28">7 Rate limit</text><text class="s" x="12" y="50">10/min sign-in,</text><text class="s" x="12" y="66">600/min other</text>
    </g>
    <path class="arrow" d="M180,99 L198,99"/><path class="arrow" d="M350,99 L368,99"/><path class="arrow" d="M520,99 L538,99"/>
    <path class="arrow" d="M690,99 L708,99"/><path class="arrow" d="M860,99 L878,99"/><path class="arrow" d="M1030,99 L1048,99"/>
    <path class="arrow" d="M1110,140 L1110,188"/>
    <!-- row 2 (right to left) -->
    <g transform="translate(1020,190)">
      <rect width="150" height="78" rx="8" class="built"/><text class="t b" x="12" y="28">8 Allowed?</text><text class="s" x="12" y="50">permission code for</text><text class="s" x="12" y="66">this property</text>
    </g>
    <g transform="translate(850,190)">
      <rect width="150" height="78" rx="8" class="built"/><text class="t b" x="12" y="28">9 Valid input?</text><text class="s" x="12" y="50">FluentValidation,</text><text class="s" x="12" y="66">field-level messages</text>
    </g>
    <g transform="translate(680,190)">
      <rect width="150" height="78" rx="8" class="built"/><text class="t b" x="12" y="28">10 Business rule</text><text class="s" x="12" y="50">application service</text><text class="s" x="12" y="66">for the module</text>
    </g>
    <g transform="translate(510,190)">
      <rect width="150" height="78" rx="8" class="built"/><text class="t b" x="12" y="28">11 Data access</text><text class="s" x="12" y="50">EF Core, tenant filter,</text><text class="s" x="12" y="66">version check</text>
    </g>
    <g transform="translate(340,190)">
      <rect width="150" height="78" rx="8" class="built"/><text class="t b" x="12" y="28">12 Audit entry</text><text class="s" x="12" y="50">old/new values, who,</text><text class="s" x="12" y="66">why — same commit</text>
    </g>
    <g transform="translate(170,190)">
      <rect width="150" height="78" rx="8" fill="#0E3B43"/><text class="t b w" x="12" y="28">13 PostgreSQL</text><text class="s" x="12" y="50" style="fill:#D6E4E6">constraints are the</text><text class="s" x="12" y="66" style="fill:#D6E4E6">last line of defence</text>
    </g>
    <path class="arrow" d="M1018,229 L1002,229"/><path class="arrow" d="M848,229 L832,229"/><path class="arrow" d="M678,229 L662,229"/>
    <path class="arrow" d="M508,229 L492,229"/><path class="arrow" d="M338,229 L322,229"/>
    <text class="xs" x="30" y="300">A request that fails at any step stops there and returns {code, message, details, correlationId}. The correlation id finds the matching server log line.</text>
  </g>
</svg>

<!-- ============ 11. Booking flow (Sprint 5) ============ -->
<svg id="booking-flow" width="1200" height="470" viewBox="0 0 1200 470">
  <rect width="1200" height="470" fill="#fff"/>
  <style>.lane{fill:#F5F7F6;stroke:#DCE3E1}.step{fill:#fff;stroke:#0E3B43;stroke-width:1.6}.win{fill:#E3F0E6;stroke:#2E6B3C;stroke-width:1.6}.lose{fill:#FBEAEA;stroke:#8A2449;stroke-width:1.6}</style>
  <text class="h" x="30" y="34">Two receptionists book the last Deluxe room at the same moment</text>
  <rect class="lane" x="30" y="56" width="1140" height="170" rx="10"/>
  <text class="t b" x="46" y="82">Booking A</text>
  <rect class="step" x="46" y="98" width="200" height="64" rx="8"/><text class="s" x="58" y="122">1. Claim the Idempotency-Key</text><text class="xs" x="58" y="144">INSERT … ON CONFLICT</text>
  <rect class="step" x="266" y="98" width="230" height="64" rx="8"/><text class="s" x="278" y="122">2. Lock the Deluxe rooms</text><text class="xs" x="278" y="144">SELECT … ORDER BY id FOR UPDATE</text>
  <rect class="step" x="516" y="98" width="200" height="64" rx="8"/><text class="s" x="528" y="122">3. Find a free room</text><text class="xs" x="528" y="144">Room 102 is free → take it</text>
  <rect class="step" x="736" y="98" width="190" height="64" rx="8"/><text class="s" x="748" y="122">4. Price every night</text><text class="xs" x="748" y="144">rate grid → breakdown rows</text>
  <rect class="win" x="946" y="98" width="210" height="64" rx="8"/><text class="s b" x="958" y="122">5. Insert and COMMIT</text><text class="xs" x="958" y="144">201 Created · R00007</text>
  <path class="arrow" d="M246,130 L264,130"/><path class="arrow" d="M496,130 L514,130"/><path class="arrow" d="M716,130 L734,130"/><path class="arrow" d="M926,130 L944,130"/>
  <text class="xs" x="46" y="190">Holds the lock on every Deluxe room row until COMMIT.</text>
  <text class="xs" x="46" y="208">Bookings for other room types never wait for it.</text>
  <rect class="lane" x="30" y="246" width="1140" height="140" rx="10"/>
  <text class="t b" x="46" y="272">Booking B</text>
  <rect class="step" x="46" y="288" width="200" height="64" rx="8"/><text class="s" x="58" y="312">1. Claim its own key</text><text class="xs" x="58" y="334">different key, no wait</text>
  <rect class="step" x="266" y="288" width="230" height="64" rx="8"/><text class="s" x="278" y="312">2. Lock the Deluxe rooms</text><text class="xs" x="278" y="334">WAITS until A commits</text>
  <rect class="step" x="516" y="288" width="200" height="64" rx="8"/><text class="s" x="528" y="312">3. Find a free room</text><text class="xs" x="528" y="334">sees R00007 on Room 102</text>
  <rect class="lose" x="736" y="288" width="420" height="82" rx="8"/><text class="s b" x="748" y="312">409 ROOM_UNAVAILABLE, nothing written</text><text class="xs" x="748" y="334">"No Deluxe room is free for the night of 14 Oct 2026.</text><text class="xs" x="748" y="352">Choose another room type or other dates."</text>
  <path class="arrow" d="M246,320 L264,320"/><path class="arrow" d="M496,320 L514,320"/><path class="arrow" d="M716,320 L734,320"/>
  <path class="arrowp" d="M1050,162 C1050,230 400,220 390,286"/><text class="xs" x="560" y="214" style="fill:#4A5A5E">A's COMMIT releases the lock</text>

  <text class="s" x="46" y="426"><tspan class="b">Final guard:</tspan> even if some code skipped the lock, the EXCLUDE constraint on reservation_units refuses the second row (SQLSTATE 23P01 → 409).</text>
  <text class="s" x="46" y="444"><tspan class="b">Retry safe:</tspan> if A's browser retries with the same key, it gets the stored 201 back (Idempotent-Replayed: true), never a second booking.</text>
</svg>
<svg id="room-move-flow" width="1200" height="500" viewBox="0 0 1200 500">
  <rect width="1200" height="500" fill="#fff"/>
  <style>.lane{fill:#F5F7F6;stroke:#DCE3E1}.step{fill:#fff;stroke:#0E3B43;stroke-width:1.6}.win{fill:#E3F0E6;stroke:#2E6B3C;stroke-width:1.6}.lose{fill:#FBEAEA;stroke:#8A2449;stroke-width:1.6}</style>
  <text class="h" x="30" y="34">Sprint 06: two receptionists drag different bookings onto Room 103 at the same moment</text>
  <rect class="lane" x="30" y="56" width="1140" height="170" rx="10"/>
  <text class="t b" x="46" y="82">Move A (R00012: 101 → 103)</text>
  <rect class="step" x="46" y="98" width="200" height="64" rx="8"/><text class="s" x="58" y="122">1. Drop + reason</text><text class="xs" x="58" y="144">browser asks, sends version</text>
  <rect class="step" x="266" y="98" width="200" height="64" rx="8"/><text class="s" x="278" y="122">2. Lock R00012's row</text><text class="xs" x="278" y="144">version must match (else 409)</text>
  <rect class="step" x="486" y="98" width="200" height="64" rx="8"/><text class="s" x="498" y="122">3. Lock Room 103's row</text><text class="xs" x="498" y="144">SELECT … FOR UPDATE</text>
  <rect class="step" x="706" y="98" width="200" height="64" rx="8"/><text class="s" x="718" y="122">4. Is 103 free?</text><text class="xs" x="718" y="144">held bookings + active blocks</text>
  <rect class="win" x="926" y="98" width="230" height="64" rx="8"/><text class="s b" x="938" y="122">5. Supersede, insert, COMMIT</text><text class="xs" x="938" y="144">same nights, same prices, note</text>
  <path class="arrow" d="M246,130 L264,130"/><path class="arrow" d="M466,130 L484,130"/><path class="arrow" d="M686,130 L704,130"/><path class="arrow" d="M906,130 L924,130"/>
  <text class="xs" x="46" y="190">The old row stops holding (superseded_at) and stays as history; the new row copies its nightly prices.</text>
  <text class="xs" x="46" y="208">The audit trail records both rows with who and the reason; the booking gets a note "Moved from Room 101 to Room 103".</text>
  <rect class="lane" x="30" y="246" width="1140" height="140" rx="10"/>
  <text class="t b" x="46" y="272">Move B (R00015: 104 → 103)</text>
  <rect class="step" x="46" y="288" width="200" height="64" rx="8"/><text class="s" x="58" y="312">1. Drop + reason</text><text class="xs" x="58" y="334">same moment as A</text>
  <rect class="step" x="266" y="288" width="200" height="64" rx="8"/><text class="s" x="278" y="312">2. Lock R00015's row</text><text class="xs" x="278" y="334">a different booking: no wait</text>
  <rect class="step" x="486" y="288" width="200" height="64" rx="8"/><text class="s" x="498" y="312">3. Lock Room 103's row</text><text class="xs" x="498" y="334">WAITS until A commits</text>
  <rect class="lose" x="706" y="288" width="450" height="82" rx="8"/><text class="s b" x="718" y="312">409 ROOM_UNAVAILABLE, nothing written</text><text class="xs" x="718" y="334">"Room 103 isn't free for the nights of 20 Oct – 21 Oct 2026:</text><text class="xs" x="718" y="352">it is booked on R00012. Choose another room."</text>
  <path class="arrow" d="M246,320 L264,320"/><path class="arrow" d="M466,320 L484,320"/><path class="arrow" d="M686,320 L704,320"/>
  <path class="arrowp" d="M1040,162 C1040,230 600,220 590,286"/><text class="xs" x="1050" y="240" style="fill:#4A5A5E">A's COMMIT releases the lock</text>
  <rect class="zone" x="30" y="404" width="1140" height="80" rx="8"/>
  <text class="s" x="46" y="426"><tspan class="b">Same order as booking:</tspan> reservation row first, then room rows. Booking, date changes, blocks and moves all lock Room 103's row, so they queue.</text>
  <text class="s" x="46" y="446"><tspan class="b">Final guard:</tspan> the EXCLUDE constraint and the block trigger on reservation_units refuse an overlapping row (23P01 → 409).</text>
  <text class="s" x="46" y="466"><tspan class="b">The screen never guesses:</tspan> the bar moves only after the server says 200 and the calendar reloads; a 409 shows its reason.</text>
</svg>
<svg id="check-in-flow" width="1200" height="560" viewBox="0 0 1200 560">
  <rect width="1200" height="560" fill="#fff"/>
  <style>.lane{fill:#F5F7F6;stroke:#DCE3E1}.step{fill:#fff;stroke:#0E3B43;stroke-width:1.6}.win{fill:#E3F0E6;stroke:#2E6B3C;stroke-width:1.6}.lose{fill:#FBEAEA;stroke:#8A2449;stroke-width:1.6}.ask{fill:#FBEFD8;stroke:#8A5A00;stroke-width:1.6}</style>
  <text class="h" x="30" y="34">Sprint 07: check-in and check-out at the front desk ("today" is always the property's date, Asia/Kolkata)</text>

  <rect class="step" x="46" y="98" width="170" height="64" rx="8"/><text class="s" x="58" y="122">1. Lock R00001's row</text><text class="xs" x="58" y="144">the second click WAITS here</text>
  <rect class="step" x="234" y="98" width="170" height="64" rx="8"/><text class="s" x="246" y="122">2. Status and date</text><text class="xs" x="246" y="144">arrives today, not over</text>
  <rect class="step" x="422" y="98" width="170" height="64" rx="8"/><text class="s" x="434" y="122">3. Lock room rows</text><text class="xs" x="434" y="144">in id order: no deadlocks</text>
  <rect class="step" x="610" y="98" width="170" height="64" rx="8"/><text class="s" x="622" y="122">4. Previous guest gone?</text><text class="xs" x="622" y="144">else 409 ROOM_OCCUPIED</text>

  <path class="arrow" d="M216,130 L232,130"/><path class="arrow" d="M404,130 L420,130"/><path class="arrow" d="M592,130 L608,130"/><path class="arrow" d="M780,130 L796,130"/><path class="arrow" d="M968,130 L984,130"/>
  <rect class="ask" x="610" y="186" width="358" height="74" rx="8"/><text class="s b" x="622" y="208">Not ready: 409 HOUSEKEEPING_NOT_READY</text><text class="xs" x="622" y="228">"Room 101 is dirty, not ready." The desk chooses another room,</text><text class="xs" x="622" y="246">or checks in anyway with a reason (kept in history and a note).</text>

  <rect class="step" x="266" y="338" width="200" height="64" rx="8"/><text class="s" x="278" y="362">2. Folio balance &gt; 0?</text><text class="xs" x="278" y="384">422 BALANCE_DUE (setting)</text>
  <rect class="step" x="486" y="338" width="200" height="64" rx="8"/><text class="s" x="498" y="362">3. Leaving early?</text><text class="xs" x="498" y="384">reason; nights left released</text>
  <rect class="step" x="706" y="338" width="200" height="64" rx="8"/><text class="s" x="718" y="362">4. Rooms → DIRTY</text><text class="xs" x="718" y="384">+ CHECK_OUT history row</text>

  <text class="xs" x="46" y="428">The housekeeping event is written with the check-out, so it can't be lost or left behind by a check-out that rolled back. Sprint 13 turns it into a cleaning task (consumed_at).</text>
  <rect class="zone" x="30" y="464" width="1140" height="80" rx="8"/>

  <text class="s" x="46" y="526"><tspan class="b">Same lock order as booking and moves:</tspan> reservation row first, then room rows by id, so the front desk queues behind a booking instead of deadlocking.</text>

<svg id="folio-flow" width="1200" height="616" viewBox="0 0 1200 616">
  <rect width="1200" height="616" fill="#fff"/>
  <style>.lane{fill:#F5F7F6;stroke:#DCE3E1}.step{fill:#fff;stroke:#0E3B43;stroke-width:1.6}.win{fill:#E3F0E6;stroke:#2E6B3C;stroke-width:1.6}.lose{fill:#FBEAEA;stroke:#8A2449;stroke-width:1.6}.ask{fill:#FBEFD8;stroke:#8A5A00;stroke-width:1.6}</style>
  <text class="h" x="30" y="34">Sprint 08: the bill of a stay. Lines are only ever added: a correction is a new, negative line</text>
  <rect class="lane" x="30" y="56" width="1140" height="230" rx="10"/>
  <text class="t b" x="46" y="82">Post a charge, then reverse it (two managers press Reverse at the same moment)</text>
  <rect class="step" x="46" y="98" width="200" height="64" rx="8"/><text class="s" x="58" y="122">1. Idempotency-Key</text><text class="xs" x="58" y="144">a retried click posts once</text>
  <rect class="step" x="266" y="98" width="200" height="64" rx="8"/><text class="s" x="278" y="122">2. Lock the booking's row</text><text class="xs" x="278" y="144">charges queue up per stay</text>
  <rect class="step" x="486" y="98" width="200" height="64" rx="8"/><text class="s" x="498" y="122">3. Takes charges?</text><text class="xs" x="498" y="144">confirmed, in house, left</text>
  <rect class="win" x="706" y="98" width="220" height="64" rx="8"/><text class="s b" x="718" y="122">4. INSERT CHARGE, COMMIT</text><text class="xs" x="718" y="144">amount = qty × price (CHECK)</text>
  <path class="arrow" d="M246,130 L264,130"/><path class="arrow" d="M466,130 L484,130"/><path class="arrow" d="M686,130 L704,130"/>
  <rect class="lose" x="946" y="98" width="210" height="64" rx="8"/><text class="s b" x="958" y="122">Cancelled booking</text><text class="xs" x="958" y="144">422 FOLIO_CLOSED, in words</text>
  <rect class="step" x="46" y="186" width="200" height="64" rx="8"/><text class="s" x="58" y="210">Reverse: folio.adjust</text><text class="xs" x="58" y="232">+ a reason (3–500 chars)</text>
  <rect class="step" x="266" y="186" width="200" height="64" rx="8"/><text class="s" x="278" y="210">Lock, then reversed yet?</text><text class="xs" x="278" y="232">the second click WAITS here</text>
  <rect class="win" x="486" y="186" width="220" height="64" rx="8"/><text class="s b" x="498" y="210">INSERT REVERSAL, COMMIT</text><text class="xs" x="498" y="232">trigger: negates the charge exactly</text>
  <rect class="lose" x="726" y="186" width="430" height="64" rx="8"/><text class="s b" x="738" y="210">The second click: 409 ALREADY_REVERSED</text><text class="xs" x="738" y="232">"… was already reversed at 14:05 by Rita (reason: …)"; UNIQUE backs it up.</text>
  <path class="arrow" d="M246,218 L264,218"/><path class="arrow" d="M466,218 L484,218"/>
  <text class="xs" x="46" y="274">Move lines to another folio (split) = a reversal here ("Moved to F00007") + the same line there (transferred_from_item_id): both bills keep their history, the stay's total doesn't change.</text>
  <rect class="lane" x="30" y="306" width="1140" height="170" rx="10"/>
  <text class="t b" x="46" y="332">Room nights: three writers, one rule (each night of a stay is charged once)</text>
  <rect class="step" x="46" y="348" width="250" height="78" rx="8"/><text class="s" x="58" y="372">Check-in (default AT_CHECK_IN)</text><text class="xs" x="58" y="392">every night of the stay</text><text class="xs" x="58" y="410">NIGHTLY: tonight only</text>
  <rect class="step" x="46" y="436" width="250" height="30" rx="8"/><text class="xs" x="58" y="456">Job every 15 min · Check-out: nights still due</text>
  <rect class="step" x="336" y="348" width="250" height="78" rx="8"/><text class="s" x="348" y="372">Lock the booking's row</text><text class="xs" x="348" y="392">job, check-in and check-out</text><text class="xs" x="348" y="410">can't overlap on one stay</text>
  <rect class="step" x="626" y="348" width="250" height="78" rx="8"/><text class="s" x="638" y="372">Nights with no line yet</text><text class="xs" x="638" y="392">price = all rooms that night,</text><text class="xs" x="638" y="410">as booked (rate breakdowns)</text>
  <rect class="win" x="916" y="348" width="240" height="78" rx="8"/><text class="s b" x="928" y="372">INSERT ROOM_NIGHT</text><text class="xs" x="928" y="392">UNIQUE (reservation, night):</text><text class="xs" x="928" y="410">a second insert is refused</text>
  <path class="arrow" d="M296,387 L334,387"/><path class="arrow" d="M586,387 L624,387"/><path class="arrow" d="M876,387 L914,387"/>
  <rect class="ask" x="336" y="436" width="820" height="30" rx="8"/><text class="xs" x="348" y="456">Leaving early: the released nights' lines are reversed ("Left early on …: reason"), then the balance is checked (422 BALANCE_DUE unless allowed).</text>
  <rect class="zone" x="30" y="494" width="1140" height="104" rx="8"/>
  <text class="s" x="46" y="516"><tspan class="b">Never changed, never deleted:</tspan> triggers refuse UPDATE and DELETE on folio_items and folio_item_taxes, whoever runs them.</text>
  <text class="s" x="46" y="538"><tspan class="b">Balance is never stored:</tspan> sum of the lines (tax from Sprint 9) minus payments (Sprint 10). A charge and its reversal add up to ₹0, both stay.</text>
  <text class="s" x="46" y="560"><tspan class="b">Same lock order as the front desk:</tspan> the reservation row first, so posting, reversing, check-in, check-out and the job queue instead of racing.</text>
  <text class="s" x="46" y="580"><tspan class="b">Tax copied at posting time</tspan> (folio_item_taxes, Sprint 9): a later rate change never alters a posted bill.</text>
</svg>
<svg id="tax-flow" width="1200" height="636" viewBox="0 0 1200 636">
  <rect width="1200" height="636" fill="#fff"/>
  <style>.lane{fill:#F5F7F6;stroke:#DCE3E1}.step{fill:#fff;stroke:#0E3B43;stroke-width:1.6}.win{fill:#E3F0E6;stroke:#2E6B3C;stroke-width:1.6}.lose{fill:#FBEAEA;stroke:#8A2449;stroke-width:1.6}.ask{fill:#FBEFD8;stroke:#8A5A00;stroke-width:1.6}</style>
  <text class="h" x="30" y="34">Sprint 09: GST is data with dates. The tax engine reads the rule of the service day; the bill keeps what it used</text>
  <rect class="lane" x="30" y="56" width="1140" height="250" rx="10"/>
  <text class="t b" x="46" y="82">One charge (a room night, a dinner, a package part): TaxCalculator, used by every module that charges</text>
  <rect class="step" x="46" y="98" width="200" height="78" rx="8"/><text class="s" x="58" y="122">1. Tax category?</text><text class="xs" x="58" y="144">ROOM → Accommodation 996311</text><text class="xs" x="58" y="162">FOOD → Restaurant 996331</text>
  <rect class="step" x="266" y="98" width="200" height="78" rx="8"/><text class="s" x="278" y="122">2. Registration that day?</text><text class="xs" x="278" y="144">GSTIN of the property's state;</text><text class="xs" x="278" y="162">REGULAR charges GST</text>
  <rect class="step" x="486" y="98" width="200" height="78" rx="8"/><text class="s" x="498" y="122">3. Rule that day?</text><text class="xs" x="498" y="144">from ≤ day ≤ to (both included);</text><text class="xs" x="498" y="162">one per category (EXCLUDE)</text>
  <rect class="step" x="706" y="98" width="210" height="78" rx="8"/><text class="s" x="718" y="122">4. Slab per unit</text><text class="xs" x="718" y="144">one room / bed, one night:</text><text class="xs" x="718" y="162">₹7,500.00 → 5%, ₹7,500.01 → 18%</text>
  <rect class="win" x="936" y="98" width="220" height="78" rx="8"/><text class="s b" x="948" y="122">5. Split and round</text><text class="xs" x="948" y="144">same state: CGST + SGST (rate ÷ 2)</text><text class="xs" x="948" y="162">else IGST; each to the paisa</text>
  <path class="arrow" d="M246,137 L264,137"/><path class="arrow" d="M466,137 L484,137"/><path class="arrow" d="M686,137 L704,137"/><path class="arrow" d="M916,137 L934,137"/>
  <rect class="ask" x="46" y="190" width="420" height="44" rx="8"/><text class="xs" x="58" y="210">No category, no registration or COMPOSITION:</text><text class="xs" x="58" y="226">no GST, and the preview says why in words</text>
  <rect class="lose" x="486" y="190" width="430" height="44" rx="8"/><text class="xs" x="498" y="210">Registered and taxed but no rule for the day: 422 TAX_RULE_MISSING,</text><text class="xs" x="498" y="226">the charge is refused rather than posted without GST</text>
  <rect class="win" x="936" y="190" width="220" height="44" rx="8"/><text class="xs" x="948" y="210">folio_item_taxes: code, rate,</text><text class="xs" x="948" y="226">taxable value, amount, rule id</text>
  <text class="xs" x="46" y="262">A night with several rooms is taxed room by room (each by its own slab); parts at the same rate are added up, then rounded once per tax.</text>
  <text class="xs" x="46" y="282">Reversals and moved lines copy the tax rows of the line they come from: they never ask the engine again.</text>
  <rect class="lane" x="30" y="326" width="1140" height="170" rx="10"/>
  <text class="t b" x="46" y="352">The accountant changes GST from next month: Add rule (tax.manage), no deployment</text>
  <rect class="step" x="46" y="368" width="250" height="78" rx="8"/><text class="s" x="58" y="392">Starts today (India) or later</text><text class="xs" x="58" y="412">a rule never reaches back;</text><text class="xs" x="58" y="430">rate a multiple of 0.02%</text>
  <rect class="step" x="336" y="368" width="250" height="78" rx="8"/><text class="s" x="348" y="392">Lock the category's row</text><text class="xs" x="348" y="412">two accountants can't add</text><text class="xs" x="348" y="430">overlapping rules at once</text>
  <rect class="step" x="626" y="368" width="250" height="78" rx="8"/><text class="s" x="638" y="392">Running rule ends day − 1</text><text class="xs" x="638" y="412">its only change allowed (trigger);</text><text class="xs" x="638" y="430">any other overlap: field error</text>
  <rect class="win" x="916" y="368" width="240" height="78" rx="8"/><text class="s b" x="928" y="392">INSERT rule + slabs</text><text class="xs" x="928" y="412">with its source; unverified</text><text class="xs" x="928" y="430">until someone presses Verify</text>
  <path class="arrow" d="M296,407 L334,407"/><path class="arrow" d="M586,407 L624,407"/><path class="arrow" d="M876,407 L914,407"/>
  <text class="xs" x="46" y="476">Dinner ₹1,450 on 31 Oct: 5% → ₹72.50, kept for good. Dinner ₹1,450 on 1 Nov: 18% → ₹261.00. Same code, different row.</text>
  <rect class="zone" x="30" y="514" width="1140" height="104" rx="8"/>
  <text class="s" x="46" y="536"><tspan class="b">No rate in the code:</tspan> tax_categories, tax_rules and tax_rule_slabs hold every rate, limit and SAC code, seeded per organisation (V011).</text>
  <text class="s" x="46" y="558"><tspan class="b">History never moves:</tspan> rules are never deleted, slabs never change, and a posted line keeps the rule id and rate it used.</text>
  <text class="s" x="46" y="580"><tspan class="b">Seeded rules are unverified:</tspan> entered from public notifications; the accountant checks each and presses Verify before go-live.</text>
  <text class="s" x="46" y="602"><tspan class="b">One engine:</tspan> the folio uses it now; POS, purchasing and invoices will use the same TaxCalculator.</text>
</svg>
<svg id="payment-flow" width="1200" height="636" viewBox="0 0 1200 636">
  <rect width="1200" height="636" fill="#fff"/>
  <style>.lane{fill:#F5F7F6;stroke:#DCE3E1}.step{fill:#fff;stroke:#0E3B43;stroke-width:1.6}.win{fill:#E3F0E6;stroke:#2E6B3C;stroke-width:1.6}.lose{fill:#FBEAEA;stroke:#8A2449;stroke-width:1.6}.ask{fill:#FBEFD8;stroke:#8A5A00;stroke-width:1.6}</style>
  <text class="h" x="30" y="34">Sprint 10: money in and out. A refund can't overspend its payment; the cash drawer is a ledger that must balance</text>
  <rect class="lane" x="30" y="56" width="1140" height="250" rx="10"/>
  <text class="t b" x="46" y="82">Two refunds on the same ₹1,000 cash payment at the same moment (payment.refund, Idempotency-Key, a reason)</text>
  <rect class="step" x="46" y="98" width="200" height="78" rx="8"/><text class="s" x="58" y="122">1. Lock the booking</text><text class="xs" x="58" y="144">same order as the bill and</text><text class="xs" x="58" y="162">the front desk: no deadlock</text>
  <rect class="step" x="266" y="98" width="200" height="78" rx="8"/><text class="s" x="278" y="122">2. Lock the payment</text><text class="xs" x="278" y="144">SELECT … FOR UPDATE: the</text><text class="xs" x="278" y="162">second refund waits here</text>
  <rect class="step" x="486" y="98" width="200" height="78" rx="8"/><text class="s" x="498" y="122">3. What is left?</text><text class="xs" x="498" y="144">amount − already refunded;</text><text class="xs" x="498" y="162">on account first, then bills</text>
  <rect class="step" x="706" y="98" width="210" height="78" rx="8"/><text class="s" x="718" y="122">4. Cash? Lock the shift</text><text class="xs" x="718" y="144">at most what the drawer</text><text class="xs" x="718" y="162">should hold; − movement</text>
  <rect class="win" x="936" y="98" width="220" height="78" rx="8"/><text class="s b" x="948" y="122">5. INSERT refund, COMMIT</text><text class="xs" x="948" y="144">trigger checks the limits again;</text><text class="xs" x="948" y="162">status PARTIALLY_REFUNDED</text>
  <path class="arrow" d="M246,137 L264,137"/><path class="arrow" d="M466,137 L484,137"/><path class="arrow" d="M686,137 L704,137"/><path class="arrow" d="M916,137 L934,137"/>
  <rect class="lose" x="46" y="190" width="640" height="44" rx="8"/><text class="xs" x="58" y="210">The second refund of ₹900 gets the lock after the first ₹200 commits, sees ₹800 left: 400 under Amount</text><text class="xs" x="58" y="226">"P00003 was ₹1,000 and ₹200 of it is already refunded, so at most ₹800 can be refunded."</text>
  <rect class="win" x="706" y="190" width="450" height="44" rx="8"/><text class="xs" x="718" y="210">fn_payment_money_check: refunded ≤ amount, a bill gets back at most</text><text class="xs" x="718" y="226">what the payment put on it. Holds for any code or SQL.</text>
  <text class="xs" x="46" y="262">A payment goes on a bill (at most what it owes) or stays on account for the booking (an advance) until it is put on a bill; nothing is stored twice.</text>
  <text class="xs" x="46" y="282">Void (entered by mistake): CANCELLED with a reason, counts for nothing; refused once anything is refunded or its cash shift is closed.</text>
  <rect class="lane" x="30" y="326" width="1140" height="170" rx="10"/>
  <text class="t b" x="46" y="352">The cash drawer shift: what it should hold is the sum of its movements, never a number someone types</text>
  <rect class="step" x="46" y="368" width="200" height="78" rx="8"/><text class="s" x="58" y="392">Open (operate)</text><text class="xs" x="58" y="412">float counted in: + ₹5,000</text><text class="xs" x="58" y="430">one open shift per drawer</text>
  <rect class="step" x="266" y="368" width="200" height="78" rx="8"/><text class="s" x="278" y="392">Movements</text><text class="xs" x="278" y="412">+ ₹1,000 cash P00003</text><text class="xs" x="278" y="430">− ₹200 refund · = ₹5,800</text>
  <rect class="step" x="486" y="368" width="200" height="78" rx="8"/><text class="s" x="498" y="392">Close: count</text><text class="xs" x="498" y="412">₹5,750 counted − ₹5,800</text><text class="xs" x="498" y="430">expected = − ₹50 (short)</text>
  <rect class="ask" x="706" y="368" width="210" height="78" rx="8"/><text class="s b" x="718" y="392">VARIANCE_PENDING</text><text class="xs" x="718" y="412">needs a reason: "Gave too</text><text class="xs" x="718" y="430">much change to a guest"</text>
  <rect class="win" x="936" y="368" width="220" height="78" rx="8"/><text class="s b" x="948" y="392">Approve → CLOSED</text><text class="xs" x="948" y="412">cash_drawer.approve_variance,</text><text class="xs" x="948" y="430">with a note; audited</text>
  <path class="arrow" d="M246,407 L264,407"/><path class="arrow" d="M466,407 L484,407"/><path class="arrow" d="M686,407 L704,407"/><path class="arrow" d="M916,407 L934,407"/>
  <text class="xs" x="46" y="476">Count = expected: CLOSED at once. Movements can only be added while the shift is OPEN (trigger), so a closed count never drifts.</text>
  <rect class="zone" x="30" y="514" width="1140" height="104" rx="8"/>
  <text class="s" x="46" y="536"><tspan class="b">Nothing is deleted:</tspan> a payment changes only its status (along payment_status_transitions) and void; allocations, refunds and movements never change.</text>
  <text class="s" x="46" y="558"><tspan class="b">No card data, ever:</tspan> no column for it; a card reference can't hold 13+ digits (CHECK); anything passing the Luhn check is refused under its field.</text>
  <text class="s" x="46" y="580"><tspan class="b">Balances are sums:</tspan> a bill's paid = its allocations − refunds off it; the booking's balance (check-out) also counts money on account.</text>
  <text class="s" x="46" y="602"><tspan class="b">Idempotency-Key</tspan> on taking and refunding money: a double click or a retry never moves money twice.</text>
</svg>
<svg id="razorpay-flow" width="1200" height="660" viewBox="0 0 1200 660">
  <rect width="1200" height="660" fill="#fff"/>
  <style>.lane{fill:#F5F7F6;stroke:#DCE3E1}.step{fill:#fff;stroke:#0E3B43;stroke-width:1.6}.win{fill:#E3F0E6;stroke:#2E6B3C;stroke-width:1.6}.lose{fill:#FBEAEA;stroke:#8A2449;stroke-width:1.6}.ask{fill:#FBEFD8;stroke:#8A5A00;stroke-width:1.6}</style>
  <text class="h" x="30" y="34">Sprint 11: Razorpay. The guest pays on a link; only Razorpay's signed webhook records the payment, once, whatever the order</text>
  <rect class="lane" x="30" y="56" width="1140" height="200" rx="10"/>
  <text class="t b" x="46" y="82">A payment link (payment.create, Idempotency-Key): staff ask, the guest pays, the browser only waits</text>
  <rect class="step" x="46" y="98" width="200" height="78" rx="8"/><text class="s" x="58" y="122">1. Send payment link</text><text class="xs" x="58" y="144">amount ≤ owed − open links;</text><text class="xs" x="58" y="162">≥ ₹1 (Razorpay's minimum)</text>
  <rect class="step" x="266" y="98" width="200" height="78" rx="8"/><text class="s" x="278" y="122">2. Razorpay order</text><text class="xs" x="278" y="144">POST /orders in paise; retries</text><text class="xs" x="278" y="162">with jitter, 10 s timeout</text>
  <rect class="step" x="486" y="98" width="200" height="78" rx="8"/><text class="s" x="498" y="122">3. Guest opens /pay/…</text><text class="xs" x="498" y="144">no sign-in: a 32-byte random</text><text class="xs" x="498" y="162">token is the proof</text>
  <rect class="step" x="706" y="98" width="210" height="78" rx="8"/><text class="s" x="718" y="122">4. Razorpay Checkout</text><text class="xs" x="718" y="144">UPI, cards: details go to</text><text class="xs" x="718" y="162">Razorpay, never to us</text>
  <rect class="ask" x="936" y="98" width="220" height="78" rx="8"/><text class="s b" x="948" y="122">5. Browser callback</text><text class="xs" x="948" y="144">signature checked; the page says</text><text class="xs" x="948" y="162">"confirming", records nothing</text>
  <path class="arrow" d="M246,137 L264,137"/><path class="arrow" d="M466,137 L484,137"/><path class="arrow" d="M686,137 L704,137"/><path class="arrow" d="M916,137 L934,137"/>
  <text class="xs" x="46" y="204">A declined try is noted on the link (attempts, the bank's reason) and the link stays open. A cancelled link still records money that arrives anyway.</text>
  <text class="xs" x="46" y="224">Without keys (development, browser tests) the built-in fake Razorpay answers the same HTTP calls and sends signed webhooks; refused in production.</text>
  <rect class="lane" x="30" y="276" width="1140" height="250" rx="10"/>
  <text class="t b" x="46" y="302">POST /api/v1/webhooks/razorpay: verify, claim the event id, ask Razorpay, then move forward only</text>
  <rect class="lose" x="46" y="318" width="200" height="78" rx="8"/><text class="s b" x="58" y="342">1. HMAC-SHA256</text><text class="xs" x="58" y="362">raw body + webhook secret,</text><text class="xs" x="58" y="380">constant time. Wrong: 401</text>
  <rect class="step" x="266" y="318" width="200" height="78" rx="8"/><text class="s" x="278" y="342">2. Claim the event id</text><text class="xs" x="278" y="362">INSERT webhook_events … ON</text><text class="xs" x="278" y="380">CONFLICT: a repeat stops here</text>
  <rect class="step" x="486" y="318" width="200" height="78" rx="8"/><text class="s" x="498" y="342">3. Verify then trust</text><text class="xs" x="498" y="362">GET /payments/{id}: Razorpay's</text><text class="xs" x="498" y="380">status, order, amount now</text>
  <rect class="step" x="706" y="318" width="210" height="78" rx="8"/><text class="s" x="718" y="342">4. Forward only</text><text class="xs" x="718" y="362">rank: none &lt; authorised &lt;</text><text class="xs" x="718" y="380">failed &lt; captured; never back</text>
  <rect class="win" x="936" y="318" width="220" height="78" rx="8"/><text class="s b" x="948" y="342">5. One transaction</text><text class="xs" x="948" y="362">P… CAPTURED, link PAID, on the</text><text class="xs" x="948" y="380">bill, PENDING → CONFIRMED</text>
  <path class="arrow" d="M246,357 L264,357"/><path class="arrow" d="M466,357 L484,357"/><path class="arrow" d="M686,357 L704,357"/><path class="arrow" d="M916,357 L934,357"/>
  <rect class="win" x="46" y="410" width="640" height="44" rx="8"/><text class="xs" x="58" y="430">Same event twice (or at once): the unique (provider, event_id) row lets one in; the other gets 200 "already processed".</text><text class="xs" x="58" y="446">A payment can't be recorded twice either: payments are unique on Razorpay's payment id.</text>
  <rect class="ask" x="706" y="410" width="450" height="44" rx="8"/><text class="xs" x="718" y="430">Captured before authorised: step 3 already sees captured, so the late</text><text class="xs" x="718" y="446">authorised event "changes nothing" and is stored IGNORED.</text>
  <text class="xs" x="46" y="482">Our own error: the event is stored FAILED with the reason, the transaction rolls back and Razorpay gets 500, so it retries; the retry takes the FAILED row over.</text>
  <text class="xs" x="46" y="502">Every event is kept (PROCESSED, IGNORED or FAILED) with what it did, shown under History on the booking's payment links. Card, contact and UPI id are stripped first.</text>
  <rect class="zone" x="30" y="544" width="1140" height="98" rx="8"/>
  <text class="s" x="46" y="566"><tspan class="b">The webhook is the only writer:</tspan> nothing the browser says marks a payment paid; method ONLINE can't be typed in at the desk.</text>
  <text class="s" x="46" y="588"><tspan class="b">Refunds go back through Razorpay:</tspan> PENDING until refund.processed; refund.failed puts the money back on the payment. Online payments can't be voided.</text>
  <text class="s" x="46" y="610"><tspan class="b">Amounts:</tspan> paise at the Razorpay boundary, rupees numeric(12,2) inside. <tspan class="b">Keys:</tspan> Razorpay__KeyId, __KeySecret, __WebhookSecret in .env, never in git.</text>
</svg>
<svg id="invoice-flow" width="1200" height="660" viewBox="0 0 1200 660">
  <rect width="1200" height="660" fill="#fff"/>
  <style>.lane{fill:#F5F7F6;stroke:#DCE3E1}.step{fill:#fff;stroke:#0E3B43;stroke-width:1.6}.win{fill:#E3F0E6;stroke:#2E6B3C;stroke-width:1.6}.lose{fill:#FBEAEA;stroke:#8A2449;stroke-width:1.6}.ask{fill:#FBEFD8;stroke:#8A5A00;stroke-width:1.6}</style>
  <text class="h" x="30" y="34">Sprint 12: GST invoices. A gap-free number in the same transaction; an issued invoice is only ever corrected by a note</text>
  <rect class="lane" x="30" y="56" width="1140" height="250" rx="10"/>
  <text class="t b" x="46" y="82">Check-out (or Issue invoice on the bill, invoice.create + Idempotency-Key): one transaction, under the booking's lock</text>
  <rect class="step" x="46" y="98" width="200" height="78" rx="8"/><text class="s" x="58" y="122">1. Lock the folio</text><text class="xs" x="58" y="144">booking first, then the folio:</text><text class="xs" x="58" y="162">same order as posting charges</text>
  <rect class="step" x="266" y="98" width="200" height="78" rx="8"/><text class="s" x="278" y="122">2. What is unbilled?</text><text class="xs" x="278" y="144">live charges not on an invoice</text><text class="xs" x="278" y="162">that stands, net of credits</text>
  <rect class="step" x="486" y="98" width="200" height="78" rx="8"/><text class="s" x="498" y="122">3. Check everything</text><text class="xs" x="498" y="144">GST registration, customer</text><text class="xs" x="498" y="162">GSTIN, composition … first</text>
  <rect class="step" x="706" y="98" width="210" height="78" rx="8"/><text class="s" x="718" y="122">4. Take the number</text><text class="xs" x="718" y="144">INSERT … ON CONFLICT DO UPDATE</text><text class="xs" x="718" y="162">last_number + 1 RETURNING</text>
  <rect class="win" x="936" y="98" width="220" height="78" rx="8"/><text class="s b" x="948" y="122">5. INSERT invoice, COMMIT</text><text class="xs" x="948" y="144">lines + taxes copied from the</text><text class="xs" x="948" y="162">folio; totals checked at commit</text>
  <path class="arrow" d="M246,137 L264,137"/><path class="arrow" d="M466,137 L484,137"/><path class="arrow" d="M686,137 L704,137"/><path class="arrow" d="M916,137 L934,137"/>
  <rect class="win" x="46" y="190" width="640" height="44" rx="8"/><text class="xs" x="58" y="210">20 invoices at the same moment: the series row stays locked until each commits, so they get 1 … 20 in turn.</text><text class="xs" x="58" y="226">A failure rolls the number back with the invoice: no gaps, no repeats (unique per property).</text>
  <rect class="ask" x="706" y="190" width="450" height="44" rx="8"/><text class="xs" x="718" y="210">A folio that can't be invoiced at check-out (wrong GSTIN on file):</text><text class="xs" x="718" y="226">the guest still leaves; a booking note says why; issue it from the bill.</text>
  <text class="xs" x="46" y="262">BEACH/2627/00001: property code (≤ 5), a letter for the type (B bill of supply, C credit, D debit, R receipt), the financial year April–March, the number. ≤ 16 characters.</text>
  <text class="xs" x="46" y="282">Place of supply = the property's state (IGST Act s.12(3)): CGST + SGST even for a company from Maharashtra. A receipt for every payment on the booking.</text>
  <rect class="lane" x="30" y="326" width="1140" height="200" rx="10"/>
  <text class="t b" x="46" y="352">Corrections (credit_note.create, a reason, Idempotency-Key): the invoice itself never changes</text>
  <rect class="step" x="46" y="368" width="250" height="78" rx="8"/><text class="s b" x="58" y="392">REDUCE credit note</text><text class="xs" x="58" y="412">chosen lines or part of them; GST</text><text class="xs" x="58" y="430">at each line's rate; CREDIT line on folio</text>
  <rect class="lose" x="316" y="368" width="250" height="78" rx="8"/><text class="s b" x="328" y="392">CANCEL credit note</text><text class="xs" x="328" y="412">everything left (invoice.cancel);</text><text class="xs" x="328" y="430">the bill keeps its charges</text>
  <rect class="win" x="586" y="368" width="270" height="78" rx="8"/><text class="s b" x="598" y="392">Issue again (e.g. B2B)</text><text class="xs" x="598" y="412">new number; the company's GSTIN;</text><text class="xs" x="598" y="430">earlier credits show as a discount</text>
  <rect class="step" x="876" y="368" width="280" height="78" rx="8"/><text class="s b" x="888" y="392">Debit note</text><text class="xs" x="888" y="412">charges posted after the invoice</text><text class="xs" x="888" y="430">(a late minibar), same treatment</text>
  <path class="arrow" d="M566,407 L584,407"/>
  <text class="xs" x="46" y="474">fn_credit_note_items_limit: a line is never credited for more than is left, value or tax. ux_credit_notes_cancel: one CANCEL per invoice.</text>
  <text class="xs" x="46" y="494">A charge on an invoice that stands can't be reversed or moved on the folio; one reduced by a credit note can't be reversed (ck_folio_items_reversal_credited).</text>
  <rect class="zone" x="30" y="544" width="1140" height="98" rx="8"/>
  <text class="s" x="46" y="566"><tspan class="b">Never edited or deleted:</tspan> invoices, notes, receipts, their lines and taxes refuse UPDATE and DELETE; the series only moves on by one.</text>
