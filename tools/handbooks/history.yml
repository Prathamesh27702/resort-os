# One entry per published edition of the handbooks. Add a line when a sprint is accepted (see README.md).
# version = 1.<last accepted sprint>; bump the part after a second dot for corrections, e.g. 1.2.1
- version: "1.2"
  date: 2026-10-10
  change: "First edition. Sprints 01 (Foundation) and 02 (Accommodation) accepted; Sprint 03 (Guests) started."
- version: "1.2.1"
  date: 2026-10-10
  change: "Sprint 03 (Guests) built and in review: guest profiles, encrypted ID documents, duplicates, merge, anonymise, consent."
- version: "1.3"
  date: 2026-10-11
  change: "Sprint 03 (Guests) accepted, with review fixes: Aadhaar number check and error messages that say why. Sprint 04 (Rate plans and packages) started."
- version: "1.4"
  date: 2026-10-14
  change: "Sprint 04 (Rate plans and packages) accepted: nightly price grid, quotes, packages with revenue split. Sprint 05 (Availability engine and reservations) started."
- version: "1.5"
  date: 2026-10-15
  change: "Sprint 05 (Availability engine and reservations) accepted: race-free booking, booking wizard, booking history, date pickers. Diagrams of the reservation tables and the booking flow. Sprint 06 (Reservation calendar) started."
- version: "1.6"
  date: 2026-10-17
  change: "Sprint 06 (Reservation calendar) accepted: day, week and month calendar of rooms and dorm beds, moving a guest by drag-and-drop with a reason, list by day on phones. Room-move flow diagram. Sprint 07 (Front desk) started."
- version: "1.7"
  date: 2026-10-18
  change: "Sprint 07 (Front desk) accepted: arrivals, departures and in-house lists, check-in and check-out in a few clicks, walk-ins on one screen, early departures with a reason, rooms marked dirty and ready. Check-in flow diagram. Sprint 08 (Folio) started."
- version: "1.8"
  date: 2026-10-18
  change: "Sprint 08 (Folio) accepted: a running bill for every stay with room nights, meals, transport, activities and packages; nothing can be edited or deleted, a manager reverses a line with a reason; bills can be split; the front desk shows the real balance. Folio flow diagram. Sprint 09 (GST configuration and tax engine) started."
- version: "1.9"
  date: 2026-10-20
  change: "Sprint 09 (GST configuration and tax engine) accepted: GST worked out on every charge (CGST + SGST or IGST), rates kept as rules with dates that an accountant changes from next month without a software update, room GST by the price per room per night, posted charges keep their GST. Tax flow diagram. Sprint 10 (Payments, refunds, cash drawer) started."
- version: "1.10"
  date: 2026-10-20
  change: "Sprint 10 (Payments, refunds, cash drawer) accepted: cash, UPI, card and bank payments on the bill or on account, refunds with a reason that can never exceed the payment, voids, the cash drawer opened and closed against a count with manager approval of a shortfall, no card data stored, real balances at check-out. Payment flow diagram. Sprint 11 (Razorpay) started."
- version: "1.11"
  date: 2026-10-23
  change: "Sprint 11 (Razorpay) accepted: payment links sent from a booking, the guest pays on their phone with UPI or a card through Razorpay with no sign-in, only Razorpay's signed webhook records the payment (once, whatever the order) and confirms a pending booking, declined tries shown with the reason, online refunds back through Razorpay, a built-in test Razorpay when no keys are set. Razorpay flow diagram. Sprint 12 started."
- version: "1.12"
  date: 2026-10-25
  change: "Sprint 12 (GST invoices, credit/debit notes, receipts) accepted: check-out issues a legally numbered GST invoice and a receipt for each payment by itself, numbers run with no gap per property and financial year, an issued invoice is never edited (a credit note cancels or reduces it, a debit note bills late charges), B2B invoices with the company's GSTIN checked under the field, place of supply is the resort's state, A4 PDFs to download or print. Invoice flow diagram. Sprint 13 started."
