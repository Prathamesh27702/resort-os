  handbook:
    highlights:
      - "Staff send a payment link from a booking; the guest pays on their phone with UPI or a card through Razorpay, with no sign-in"
      - "Only Razorpay's signed notification records a payment; it goes on the bill and confirms a pending booking by itself"
      - "A notification sent twice, or out of order, is recorded once; every one is kept with what it did"
      - "A declined try is shown with the bank's reason and the link stays open; links can be cancelled with a reason"
      - "Online payments are refunded back through Razorpay; card details never reach Resort OS"
