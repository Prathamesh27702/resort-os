# Single source of truth for the sprint plan.
# docs/sprints/sprint-*.md and the GitHub milestones/issues are generated from this file
# (scripts/github/sync-sprints.py). Edit here, then re-run the script.
#
# status: planned | in-progress | in-review | done
# size:   S (≈1 dev-week) | M (≈2 dev-weeks) | L (≈3–4 dev-weeks)  — for a 2-week sprint with 2 developers

current: 1

sprints:

- id: 0
  title: Architecture and requirements
  phase: 0
  status: in-review
  size: M
  depends: []
  goal: Agree the architecture, data model, permission model, API conventions and delivery plan before more code is written.
  scope:
    docs: [ARCHITECTURE.md, DATABASE.md, API.md, SECURITY.md, docs/architecture/lifecycles.md, docs/architecture/frontend.md, docs/architecture/decisions.md, docs/architecture/risks-and-open-questions.md, docs/security/permission-matrix.md]
  tasks:
    - Owner reviews ARCHITECTURE.md (system + module map) and records approval in docs/architecture/decisions.md
    - Owner reviews the role/permission matrix and lists changes as issues
    - Owner answers the open questions in docs/architecture/risks-and-open-questions.md
    - Owner confirms hosting budget and region (affects Sprint 29)
  tests:
    - None (documentation sprint). Diagrams render on GitHub.
  acceptance:
    - Every open question has an owner and a due sprint
    - Architecture marked approved in decisions.md (ADR-0000)
  debug: []
  demo:
    - Walk through the module map and the booking lifecycle diagram

- id: 1
  title: Foundation — identity, RBAC, organisation, properties, audit
  phase: 1
  status: in-review
  size: L
  depends: [0]
  goal: A secure, multi-tenant base that every later module plugs into.
  scope:
    tables: [organizations, properties, property_settings, system_settings, users, roles, permissions, role_permissions, user_roles, refresh_tokens, login_events, audit_logs, schema_migrations]
    migrations: [V001__foundation, V002__seed_permissions_roles, V003__audit_request_context]
    api:
      - POST /api/v1/auth/login
      - POST /api/v1/auth/refresh
      - POST /api/v1/auth/logout
      - GET /api/v1/auth/me
      - POST /api/v1/auth/change-password
      - GET|PUT /api/v1/organization
      - GET|POST /api/v1/properties
      - GET|PUT /api/v1/properties/{propertyId}
      - GET /api/v1/properties/{propertyId}/settings
      - PUT /api/v1/properties/{propertyId}/settings/{key}
      - GET|POST /api/v1/users
      - GET|PUT /api/v1/users/{id}
      - PUT /api/v1/users/{id}/roles
      - POST /api/v1/users/{id}/deactivate | activate | reset-password
      - GET /api/v1/roles
      - GET /api/v1/permissions
      - GET /api/v1/audit-logs
    screens: [/login, /dashboard, /account/password, /settings/properties, /users, /roles, /audit]
    other:
      - "Screenshots of the built screens: docs/sprints/sprint-01-screens/"
  tasks:
    - "[done] Modular-monolith solution, SQL migrator with checksum guard"
    - "[done] JWT access tokens + rotating refresh cookie with reuse detection"
    - "[done] Permission-based authorisation with property-scoped grants and escalation guard"
    - "[done] Organisation/property/settings APIs with optimistic concurrency"
    - "[done] User administration APIs (create, roles, deactivate, reset)"
    - "[done] Audit interceptor + append-only triggers + audit query API"
    - "[done] Standard error shape, correlation/request IDs, /api/v1 prefix"
    - "[done] Angular shell, login, properties, users, roles matrix, audit screens"
    - "[done] 30 backend + 6 frontend tests"
    - Review and sign-off by owner (open issues for any change requests)
  tests:
    - Login, lockout, same error for unknown email vs wrong password
    - Refresh rotation and reuse detection revoking the family
    - Permission denial (403) and property scoping
    - Tenant isolation (404 across tenants)
    - Escalation guard (GM cannot grant OWNER)
    - Optimistic concurrency (409)
    - Audit with masked secrets, reason, device, request id; append-only at DB level
    - Migrator idempotent; edited migration refused
  acceptance:
    - Owner signs in, creates a property, creates a receptionist limited to one property, and sees both actions in the audit trail
    - Receptionist sees only Today and Properties; /users redirects
    - Deactivating a user signs them out immediately
  debug:
    - "401 on every call after a password change is expected: the security stamp rotated. Sign in again."
    - "403 PASSWORD_CHANGE_REQUIRED: the account still has a temporary password."
    - Access is cached for 30 s per user; restart the API if you edit user_roles directly in SQL.
  demo:
    - Sign in as owner → Today checklist → edit property → add staff → roles matrix → audit trail

- id: 2
  title: Accommodation — room types, rooms, dormitory beds, blocks
  phase: 1
  status: planned
  size: M
  depends: [1]
  goal: Model the 6 rooms and the dormitory correctly (room-based vs bed-based inventory) and let managers block units.
  scope:
    tables: [accommodation_types, accommodation_units, beds, amenities, accommodation_type_amenities, unit_images, unit_blocks]
    api:
      - GET|POST /api/v1/properties/{propertyId}/accommodation-types
      - GET|PUT /api/v1/properties/{propertyId}/accommodation-types/{id}
      - GET|POST /api/v1/properties/{propertyId}/rooms
      - GET|PUT /api/v1/properties/{propertyId}/rooms/{id}
      - GET|POST /api/v1/properties/{propertyId}/rooms/{id}/beds
      - PUT /api/v1/properties/{propertyId}/beds/{id}
      - GET|POST /api/v1/properties/{propertyId}/blocks
      - POST /api/v1/properties/{propertyId}/blocks/{id}/release
      - GET /api/v1/properties/{propertyId}/amenities
    screens:
      - "/rooms"
      - "/rooms/status (read-only for now)"
      - "/settings/room-types"
    other:
      - "Development seed-data runner (database/seed/dev) — brief §71"
  tasks:
    - "DB: new migration — accommodation tables. accommodation_types.inventory_mode CHECK IN ('UNIT','BED'); beds only allowed under BED-mode units (trigger or app rule + test)"
    - "DB: unit_blocks with tstzrange/daterange + EXCLUDE constraint preventing overlapping active blocks on the same unit/bed"
    - "API: accommodation types CRUD (accommodation.manage), rooms CRUD, beds CRUD, blocks create/release (unit_block.manage) — all audited, reason required on block"
    - "API: deactivate rather than delete units that have history"
    - "Seed: dev seed runner (Development only, idempotent) + seed 1 property, 6 rooms (2 deluxe, 4 standard), 1 dormitory with 10 beds"
    - "UI: /rooms list grouped by type with bed counts; room editor; dorm bed editor; block dialog with date range + reason"
    - "Docs: update DATABASE.md table list, API.md catalogue, sprint-02 guide status"
  tests:
    - Integration — cannot add beds to a UNIT-mode room (422)
    - Integration — overlapping blocks on the same unit rejected by the DB (409 OVERLAP)
    - Integration — receptionist can read rooms but not create them (403)
    - Integration — block create/release audited with reason
    - Unit — inventory capacity calculation (room = 1 sellable unit, dorm = N beds)
    - Frontend — room editor form validation
  acceptance:
    - A manager configures 6 rooms and a 10-bed dorm from the UI in under 10 minutes
    - Blocking Room 103 for 2 nights shows it as blocked; a second overlapping block is refused
  debug:
    - "EXCLUDE constraints need the btree_gist extension: the migration must CREATE EXTENSION IF NOT EXISTS btree_gist."
    - "Date ranges are [check-in, check-out) in the property's local dates — never convert to UTC for availability."
  demo:
    - Create types → rooms → dorm with beds → block a room → try an overlapping block

- id: 3
  title: Guests
  phase: 2
  status: planned
  size: M
  depends: [1]
  goal: Guest profiles with only the data that is needed, encrypted sensitive fields, de-duplication and retention.
  scope:
    tables: [guests, guest_addresses, guest_documents, guest_preferences, guest_consents]
    api:
      - GET|POST /api/v1/guests
      - GET|PUT /api/v1/guests/{id}
      - GET /api/v1/guests/{id}/stays
      - POST /api/v1/guests/{id}/documents
      - GET /api/v1/guests/{id}/documents/{docId}  (guest_document.read only)
      - POST /api/v1/guests/{id}/anonymise
      - POST /api/v1/guests/merge
    screens: [/guests, /guests/:id]
  tasks:
    - "DB: new migration — guest tables; data-classification comment on every column (public/internal/confidential/sensitive, brief §59)"
    - "Infra: field-level encryption (AES-GCM, key from configuration) for ID numbers and document metadata; key rotation design documented"
    - "Infra: blob storage abstraction (IFileStore) with local-disk dev implementation for ID scans"
    - "API: search by name/phone/email (trigram index), de-duplication hint on create, merge with audit"
    - "API: anonymise (guest.delete) replaces PII, keeps stay history for accounting"
    - "Job: retention dry-run report (what would be purged) — actual purge enabled only after owner approval"
    - "Seed: 20 realistic guests (Indian + international)"
    - "UI: guest list/search, profile, documents tab hidden without guest_document.read"
  tests:
    - Integration — WAITER and HOUSEKEEPER cannot read guest documents (403) — brief §59
    - Integration — ID number stored encrypted (raw column is not plaintext)
    - Integration — anonymise keeps stays, removes PII, audited with reason
    - Unit — phone normalisation (+91 and international)
  acceptance:
    - Reception finds a returning guest by phone in one search
  debug:
    - "Lost the encryption key = lost ID data. Dev key lives in .env (Encryption__Key); never reuse across environments."
  demo:
    - Create guest → duplicate warning → upload ID → view as receptionist vs waiter

- id: 4
  title: Rate plans and packages
  phase: 2
  status: planned
  size: M
  depends: [2]
  goal: Configurable prices per type/date and packages whose revenue is split into room/food/transport/activity.
  scope:
    tables: [rate_plans, rate_plan_prices, packages, package_components, reservation_sources]
    api:
      - GET|POST /api/v1/properties/{propertyId}/rate-plans
      - PUT /api/v1/properties/{propertyId}/rate-plans/{id}
      - PUT /api/v1/properties/{propertyId}/rate-plans/{id}/prices  (bulk date range)
      - GET /api/v1/properties/{propertyId}/rates/quote?type&from&to&adults&children
      - GET|POST /api/v1/properties/{propertyId}/packages
    screens: [/settings/rates, /settings/packages]
  tasks:
    - "DB: new migration — rate tables; prices stored per date (numeric(12,2)); per-bed prices for BED mode"
    - "Domain: quote engine — nightly breakdown, extra adult/child, min stay; pure functions, fully unit-tested"
    - "Domain: package revenue split must sum exactly to package price (rounding rule documented)"
    - "API: price changes audited with old/new (brief §87)"
    - "Seed: BAR (best available rate), weekend uplift, Couple and Room + breakfast packages"
    - "UI: rate grid (type × date) with bulk edit"
  tests:
    - Unit — quote for 3 nights across a weekend boundary
    - Unit — package split rounding never loses or gains a paisa
    - Integration — price change audited
  acceptance:
    - A quote for Room 103, 2 adults, 3 nights returns a nightly breakdown matching the rate grid
  debug:
    - "Money is decimal in C# and numeric in SQL. Never float/double."
  demo:
    - Set weekend prices → quote → create a package and show its split

- id: 5
  title: Availability engine and reservations core
  phase: 2
  status: planned
  size: L
  depends: [2, 3, 4]
  goal: Race-free booking of rooms and dorm beds with idempotent create and full status history (brief §14–16).
  scope:
    tables: [reservations, reservation_units, reservation_guests, reservation_rate_breakdowns, reservation_notes, reservation_status_history, idempotency_keys]
    api:
      - GET /api/v1/properties/{propertyId}/availability?from&to&adults
      - POST /api/v1/properties/{propertyId}/reservations  (Idempotency-Key header required)
      - GET /api/v1/properties/{propertyId}/reservations
      - GET /api/v1/properties/{propertyId}/reservations/{id}
      - POST /api/v1/properties/{propertyId}/reservations/{id}/confirm | cancel | no-show
      - PUT /api/v1/properties/{propertyId}/reservations/{id}  (dates/guests; re-checks availability)
      - POST /api/v1/properties/{propertyId}/reservations/{id}/notes
    screens: [/reservations, /reservations/new, /reservations/:id]
  tasks:
    - "DB: reservation_units.stay daterange + EXCLUDE USING gist (unit_id WITH =, stay WITH &&) WHERE status is active; same for bed_id"
    - "Algorithm: transaction → SELECT ... FOR UPDATE on the unit rows → availability check → insert; exclusion constraint is the final guarantee; map 23P01 to ROOM_UNAVAILABLE"
    - "Idempotency: idempotency_keys(key, request_hash, response) — same key + same body returns the stored response; same key + different body = 422"
    - "Status machine INQUIRY→PENDING→CONFIRMED→CHECKED_IN→CHECKED_OUT, CANCELLED, NO_SHOW, REFUNDED; transitions table-driven and audited"
    - "Never delete reservations (brief §87); enquiry-stage delete is a status"
    - "Docs: write docs/architecture/booking-algorithm.md with the exact PostgreSQL behaviour"
    - "UI: new reservation wizard (dates → availability → guest → rate → confirm) in ≤ 5 clicks for a walk-in"
  tests:
    - Concurrency — two simultaneous bookings for the last room → exactly one SUCCESS, one ROOM_UNAVAILABLE (run 50×)
    - Concurrency — dorm with 1 bed left, 5 parallel requests → 1 success
    - Idempotency — same request retried → one reservation, identical response
    - Integration — cancelled reservation frees inventory
    - Integration — status transitions outside the allowed graph → 422
  acceptance:
    - Brief §16 scenario passes reliably in CI
  debug:
    - "Reproduce races locally with tests/…/ConcurrencyTests using Task.WhenAll + a Barrier; never with sleeps."
    - "Look at pg_locks while a test is paused to see who holds what."
  demo:
    - Book the last room from two browsers at once

