  tasks:
    - "[done] DB: new migration — guest tables; data-classification comment on every column (public/internal/confidential/sensitive, brief §59)"
    - "[done] Infra: field-level encryption (AES-GCM, key from configuration) for ID numbers and document metadata; key rotation design documented"
    - "[done] Infra: blob storage abstraction (IFileStore) with local-disk dev implementation for ID scans"
    - "[done] API: search by name/phone/email (trigram index), de-duplication hint on create, merge with audit"
    - "[done] API: anonymise (guest.delete) replaces PII, keeps stay history for accounting"
    - "[done] Job: retention dry-run report (what would be purged) — actual purge enabled only after owner approval"
    - "[done] Seed: 20 realistic guests (Indian + international)"
    - "[done] UI: guest list/search, profile, documents tab hidden without guest_document.read"
