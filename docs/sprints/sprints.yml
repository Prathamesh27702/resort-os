      - "database/migrations/V001__foundation.sql, V002__seed_permissions_roles.sql, V003__audit_request_context.sql"
      - "backend/Resort.Domain/ — Common/Entity.cs, Identity/Identity.cs, Organizations/Organization.cs, Audit/AuditLog.cs"
      - "backend/Resort.Contracts/Contracts.cs"
      - "backend/Resort.Application/ — Identity/AuthService.cs, Identity/UserService.cs, Properties/PropertyService.cs, Audit/AuditQueryService.cs, Common/*, Validation/Validators.cs"
      - "backend/Resort.Infrastructure/ — Persistence/AppDbContext.cs, AuditInterceptor.cs, DatabaseMigrator.cs, Bootstrapper.cs; Identity/Security.cs"
      - "backend/Resort.Api/ — Program.cs, Endpoints/AuthEndpoints.cs, Endpoints/AdminEndpoints.cs, Infrastructure/* (auth, errors, request context, .env loader)"
      - "backend/Resort.Tests/ — Integration/AuthTests.cs, Integration/AccessControlTests.cs, Unit/UnitTests.cs, Support/ResortApiFactory.cs"
      - "frontend/src/app/ — core/*, shared/can.directive.ts, layout/shell.ts, features/{auth,dashboard,settings/properties,users,audit}"
      - "scripts/*, .github/workflows/*, .vscode/*, .env.example"
    results:
      - "Backend: 30 passed, 0 failed (GitHub CI, real PostgreSQL 16)"
      - "Frontend: 6 of 6 passed; ESLint clean; production build OK"
      - "Build warnings: 0; dotnet format clean; gitleaks: no secrets in history"
      - "Manual walkthrough as owner and receptionist on desktop and 390 px phone width ([screenshots](sprint-01-screens/); step-by-step script in [REVIEWING.md](REVIEWING.md#part-b--try-it-yourself-2030-minutes))"
    outcome: "Accepted 10 Oct 2026. On main as tag sprint-01."
  depends: [0]
  goal: A secure, multi-tenant base that every later module plugs into.
  client: "Staff sign in securely, each person sees only what their role allows, the owner manages properties and staff accounts, and every change is recorded in an audit trail."
  handbook:
    # Used by tools/handbooks to write the client overview and the software documentation. Fill it in when the sprint closes.
    highlights:
      - "Secure sign-in with lockout after 5 wrong passwords and forced change of temporary passwords"
      - "17 ready-made staff roles (Owner, General Manager, Receptionist, Housekeeper, Kitchen, Driver…) and 117 permissions"
      - "Staff accounts limited to one property or all properties; deactivating someone signs them out at once"
      - "Property details, GST state, time zone and check-in/out times"
      - "Audit trail: who changed what, when, from which device, and why"
      - "Works on desktop and phone"
    design:
      ui: "An Angular 20 staff app with a left navigation that shows only the screens a person's permissions allow, and a top bar with the property name and its local clock (IST). Screens: Sign in, Today (a setup checklist that ticks itself off), Properties (list and editor), Staff accounts (list, create, edit roles, deactivate, reset password), Roles & permissions (a read-only matrix of 17 roles × 117 permissions), Audit trail (filterable history) and Change password. Every list has loading, empty and error states; forms show the server's field-level messages; the layout collapses behind a menu button below 900 px."
      api: "REST endpoints under /api/v1 for auth (login, refresh, logout, me, change-password), organisation, properties and property settings, users and their roles, roles, permissions and audit logs. Each endpoint requires one permission code, checked against the property in the route. Access tokens last 15 minutes and live in memory; the refresh token is an HttpOnly cookie that rotates on every use, and reusing an old one revokes the whole session family. Edits send back a version number (optimistic concurrency, 409 on a stale edit). Errors always come back as {code, message, details, correlationId}."
      database: "Migrations V001–V003 create 13 tables: organisations, properties and settings; users, roles, permissions, role_permissions and user_roles (a grant can be organisation-wide or for one property); refresh_tokens and login_events; audit_logs; system_settings and schema_migrations. V002 seeds the 117 permissions and 17 system roles. Database triggers make audit_logs and login_events append-only. The migrator records a SHA-256 checksum per file and refuses to start if a merged migration is edited."
    screenshots:
      - {file: docs/sprints/sprint-01-screens/03-today.png, caption: "Today: the owner's setup checklist"}
      - {file: docs/sprints/sprint-01-screens/05-property-edit.png, caption: "Property editor: address, GST state, time zone, check-in/out times"}
      - {file: docs/sprints/sprint-01-screens/07-users.png, caption: "Staff accounts with role and status"}
      - {file: docs/sprints/sprint-01-screens/08-roles.png, caption: "Roles and permissions matrix (17 roles × 117 permissions)"}
      - {file: docs/sprints/sprint-01-screens/09-audit.png, caption: "Audit trail: who changed what, when and why"}
      - {file: docs/sprints/sprint-01-screens/12-mobile-nav.png, caption: "Phone width: the menu folds behind a button", width: 2.4}
  scope:
    tables: [organizations, properties, property_settings, system_settings, users, roles, permissions, role_permissions, user_roles, refresh_tokens, login_events, audit_logs, schema_migrations]
    migrations: [V001__foundation, V002__seed_permissions_roles, V003__audit_request_context]
    api:
      - POST /api/v1/auth/login
      - POST /api/v1/auth/refresh
      - POST /api/v1/auth/logout
      - GET /api/v1/auth/me
      - POST /api/v1/auth/change-password
      - GET|PUT /api/v1/organization
      - GET|POST /api/v1/properties
      - GET|PUT /api/v1/properties/{propertyId}
      - GET /api/v1/properties/{propertyId}/settings
      - PUT /api/v1/properties/{propertyId}/settings/{key}
      - GET|POST /api/v1/users
      - GET|PUT /api/v1/users/{id}
      - PUT /api/v1/users/{id}/roles
      - POST /api/v1/users/{id}/deactivate | activate | reset-password
      - GET /api/v1/roles
      - GET /api/v1/permissions
      - GET /api/v1/audit-logs
    screens: [/login, /dashboard, /account/password, /settings/properties, /users, /roles, /audit]
    other:
      - "Screenshots of the built screens: docs/sprints/sprint-01-screens/"
  tasks:
    - "[done] Modular-monolith solution, SQL migrator with checksum guard"
    - "[done] JWT access tokens + rotating refresh cookie with reuse detection"
    - "[done] Permission-based authorisation with property-scoped grants and escalation guard"
    - "[done] Organisation/property/settings APIs with optimistic concurrency"
    - "[done] User administration APIs (create, roles, deactivate, reset)"
    - "[done] Audit interceptor + append-only triggers + audit query API"
    - "[done] Standard error shape, correlation/request IDs, /api/v1 prefix"
    - "[done] Angular shell, login, properties, users, roles matrix, audit screens"
    - "[done] 30 backend + 6 frontend tests"
    - "[done] Review and sign-off by owner (accepted 10 Oct 2026)"
  tests:
    - Login, lockout, same error for unknown email vs wrong password
    - Refresh rotation and reuse detection revoking the family
    - Permission denial (403) and property scoping
    - Tenant isolation (404 across tenants)
    - Escalation guard (GM cannot grant OWNER)
    - Optimistic concurrency (409)
    - Audit with masked secrets, reason, device, request id; append-only at DB level
    - Migrator idempotent; edited migration refused
  acceptance:
    - Owner signs in, creates a property, creates a receptionist limited to one property, and sees both actions in the audit trail
    - Receptionist sees only Today and Properties; /users redirects
    - Deactivating a user signs them out immediately
  debug:
    - "401 on every call after a password change is expected: the security stamp rotated. Sign in again."
    - "403 PASSWORD_CHANGE_REQUIRED: the account still has a temporary password."
    - Access is cached for 30 s per user; restart the API if you edit user_roles directly in SQL.
  demo:
    - Sign in as owner → Today checklist → edit property → add staff → roles matrix → audit trail

