      api: "POST /properties/{id}/payments/razorpay/orders (Idempotency-Key) creates the Razorpay order and the link; GET lists a booking's links, GET /{id} shows one with its webhook events, POST /{id}/cancel stops it. POST /webhooks/razorpay (no sign-in) checks the HMAC over the raw body, claims the event id once, asks Razorpay for the payment and applies it in one transaction. /pay/{token} serves the guest's page; its callback only shows status."
      database: "Migration V013 adds payment_gateway_orders (one row per link; what it is for never changes) and webhook_events (unique on Razorpay's event id; only a failed event can be retried). Payments get method ONLINE, unique on Razorpay's payment id; refunds get ONLINE with Razorpay's refund id."
    diagrams:
