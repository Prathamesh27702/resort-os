  tasks:
    - "[done] No card data stored, ever (brief §3)"
    - "[done] Payment status machine PENDING→AUTHORIZED→CAPTURED, FAILED, REFUNDED, PARTIALLY_REFUNDED, CANCELLED"
    - "[done] Refund ≤ captured − already refunded, enforced in a transaction with row lock"
    - "[done] Drawer close computes expected vs actual; variance needs cash_drawer.approve_variance"
  tests:
    - Concurrency — two refunds on the same payment cannot exceed the captured amount
    - Integration — DELETE payments rejected by DB
  acceptance:
    - "End of shift: drawer closes with variance approval flow"
  debug:
    - "A balance looks wrong: GET /payments?reservationId=… lists every payment of the stay with what is on account; on-account money counts for the booking but not for one bill until it is put on it."
    - "A cash payment or refund is refused with \"cash drawer isn't open\": open a shift on the front desk (Cash drawer → Open drawer); a cash refund is also capped at what the drawer should hold now."
  demo:
    - Take cash + UPI → partial refund → close drawer with ₹50 short
  handbook:
    highlights:
      - "Cash, UPI, card and bank transfer payments are recorded on the guest's bill, or taken in advance on account"
      - "Refunds need a reason and a manager or accountant, and can never give back more than was paid"
      - "The cash drawer is opened with the cash counted in it and closed against a count; a shortfall needs a reason and a manager's approval"
      - "Card numbers are never stored: anything that looks like one is refused"
      - "Payments, refunds and drawer shifts are never deleted; every change is in the audit trail"
      - "Bill balances, check-out and the calendar now show what has really been paid"
    design:
      ui: "Payments (menu) lists every payment with totals by method, filters and search, and the cash drawer panel; a payment's page shows its bills, what is on account and its refunds, with Refund, Void and Put on a bill. On a bill, Take payment chooses the method and whether the money goes on the bill or on account; the bill lists its payments and refunds. The front desk shows the cash drawer: Open drawer, Close drawer with the difference shown as you type, and Approve for managers. Every mistake is explained under its field."
      api: "GET|POST /properties/{id}/payments (list with totals; take money with an Idempotency-Key), GET /payments/{id}, POST /payments/{id}/allocate, /refund (reason, Idempotency-Key) and /void (reason); GET /cash-drawer, POST /cash-drawer/open, /close and /sessions/{id}/approve-variance. Refunds lock the booking, the payment and the cash shift in that order, so two refunds at once can't exceed the payment."
      database: "Migration V012 adds payments (status machine enforced by a trigger), payment_allocations, refunds, cash_drawers, cash_drawer_sessions and cash_drawer_movements (the drawer's ledger). Nothing can be deleted; a trigger locks the payment row and refuses any allocation or refund that would overspend it; no column can hold card data."
    diagrams:
      - {file: tools/handbooks/assets/payment-flow.png, caption: "How two refunds at once are kept within the payment, and how a cash drawer shift balances"}
    screenshots:
      - {file: docs/sprints/sprint-10-screens/01-drawer-open.png, caption: "The cash drawer on the front desk, opened with ₹5,000"}
      - {file: docs/sprints/sprint-10-screens/04-bill-paid.png, caption: "A bill paid in cash and UPI: the balance is nil"}
      - {file: docs/sprints/sprint-10-screens/03-card-number-refused.png, caption: "A card number is refused: card details are never stored"}
      - {file: docs/sprints/sprint-10-screens/05-refund.png, caption: "A refund needs a reason"}
      - {file: docs/sprints/sprint-10-screens/07-close-short.png, caption: "Closing the drawer ₹50 short, with the reason"}
      - {file: docs/sprints/sprint-10-screens/09-payments.png, caption: "Payments: the day's totals by method"}
      - {file: docs/sprints/sprint-10-screens/10-phone.png, caption: "On a phone: payments stay readable"}

- id: 11
  title: Razorpay
  phase: 3
  status: in-progress
  size: M
  module: Payments
  feature: payments
  depends: [10]
  goal: Online payments where the server-verified webhook is authoritative (brief §22).
  client: "Guests pay online with UPI and cards through Razorpay; payment links can be sent before arrival."
  progress:
    now: "Built and in review: pull request into develop, waiting for the owner's acceptance."
    done:
      - "Migration V013: payment_gateway_orders (a payment link: Razorpay order, amount, the guest's private token, CREATED / PAID / CANCELLED, declined tries) and webhook_events (every verified delivery, unique on Razorpay's event id, with what it did); payments get method ONLINE (unique on Razorpay's payment id) and refunds ONLINE with Razorpay's refund id; nothing can be deleted"
      - "IPaymentGateway + RazorpayPaymentGateway over HttpClient: a 10 s timeout per try, up to 3 tries with exponential backoff and jitter when safe (a refund is never retried on an unclear failure); a built-in fake Razorpay (same HTTP calls, signed webhooks) for tests and for development without keys, never in production"
      - "Webhook: HMAC-SHA256 over the raw body (wrong → 401, nothing stored); the event id is claimed once inside the transaction (duplicates, even at the same moment, change nothing); the payment is fetched from Razorpay and only moves forward, so captured-before-authorised is handled; our errors are stored FAILED and retried by Razorpay"
      - "One transaction: the payment is recorded, the link marked paid, the money put on the main bill (the rest on account) and a pending booking confirmed"
      - "Browser callback only checks the signature and shows \"confirming\"; it never records a payment. Online payments can't be voided; refunds go back through Razorpay and wait for refund.processed (refund.failed puts the money back)"
      - "Screens: Online payment links on a booking (send with the amount checked against what is owed, copy, WhatsApp, cancel with a reason, History of what Razorpay sent); the guest's page /pay/:token without sign-in (Razorpay Checkout, or test buttons with the fake); online details and Razorpay refunds on a payment"
      - "No new dev seed: a link needs a real order in Razorpay; the seeded pending booking R00003 is the demo booking"
      - "[done] Docs: RAZORPAY.md, API.md, DATABASE.md, schema-sprint-11.md, system design Sprint 11 and 4.21 with the Razorpay flow diagram, RUN_AND_TEST, REVIEWING"
    files:
      - "database/migrations/V013__razorpay.sql; database/queries/check-sprint-11.sql"
      - "backend/Resort.Domain/Payments/Payments.cs"
      - "backend/Resort.Contracts/PaymentContracts.cs"
      - "backend/Resort.Application/ — Payments/PaymentGateway.cs, Payments/PaymentLinkService.cs, Payments/RazorpayWebhookService.cs, Payments/PaymentService.cs, Validation/PaymentValidators.cs, Reservations/ReservationService.cs, Common/SystemActor.cs, Common/Errors.cs, Common/Abstractions.cs, DependencyInjection.cs"
      - "backend/Resort.Infrastructure/ — Payments/RazorpayPaymentGateway.cs, Payments/FakeRazorpayServer.cs, Persistence/AppDbContext.cs, DependencyInjection.cs; backend/Resort.Api/ — Endpoints/RazorpayEndpoints.cs, Infrastructure/CurrentUser.cs, Program.cs"
      - "backend/Resort.Tests/ — Integration/RazorpayTests.cs, Unit/RazorpayUnitTests.cs, Support/RazorpayFactory.cs"
      - "frontend/src/app/ — features/pay/pay.page.ts, features/payments/ (payment-links-panel.ts, payments.api.ts, payment-dialogs.ts, payment.page.ts, payments.page.ts, payment-links.spec.ts), features/reservations/reservation.page.ts, core/models.ts, app.routes.ts"
      - "frontend/e2e/sprint-11.spec.ts; scripts/check-api.mjs (Sprint 11 checks); .env.example"
