      - "ID documents (passport, Aadhaar, visa…) stored encrypted; only reception, managers and owners can open them, and every view is recorded"
      - "Aadhaar: only the last 4 digits are ever kept"
      - "Consent for WhatsApp and email offers recorded with time and staff member"
      - "Anonymise on request: personal data and documents removed, accounts still add up"
    design:
      ui: "Guests (menu) lists profiles with search-as-you-type: any part of a phone number in any format, or name, email or company. Add/edit guest checks for duplicates as soon as the phone or email is entered and shows matches with their reasons; saving again creates the profile anyway. The form covers contact details, nationality (Form-C hint for foreign nationals), address with the GST state for Indian addresses, company and GSTIN, preferences as chips, and team notes. The profile page shows contact, address, preferences, consent (Yes/No per purpose with who and when), stays (empty until Sprint 05) and, only for users with guest_document.read, ID documents with masked numbers, Show number, View scan and an Add document dialog (camera capture on phones). More → Merge folds a duplicate in; More → Anonymise (owner/GM) asks for a reason."
      api: "Endpoints under /api/v1/guests. Guests belong to the organisation, so a grant for any property is enough; anonymise and the retention report need guest.delete organisation-wide. Create returns 409 POSSIBLE_DUPLICATE with the matches until ignoreDuplicates is set. Documents are uploaded as multipart/form-data; the API sniffs the file type from its bytes, encrypts the number, details and scan, and returns only a masked number. Opening a document (number or scan) is a separate call that is audited as SENSITIVE_READ. Edits and merges carry the version the user saw (409 on a stale edit)."
      database: "Migration V005 adds guests, guest_addresses, guest_documents, guest_preferences and guest_consents, with a data classification comment on every column. Generated search_text and phone_digits columns with pg_trgm GIN indexes keep contains-search fast. Document numbers and details are bytea ciphertext with a key_id for rotation and an HMAC lookup hash; Aadhaar rows may not hold an encrypted number. Constraints guarantee anonymised rows hold no personal data and purged documents keep nothing identifying; triggers forbid deleting guests and rewriting consent history."
    diagrams:
      - {file: tools/handbooks/assets/er-guests.png, caption: "Guest tables and how they relate"}
    screenshots:
      - {file: docs/sprints/sprint-03-screens/02-search-by-phone.png, caption: "A returning guest found by phone in one search"}
      - {file: docs/sprints/sprint-03-screens/03-duplicate-warning.png, caption: "Warning before creating a second profile for the same person"}
      - {file: docs/sprints/sprint-03-screens/08-guest-profile.png, caption: "Guest profile: contact, address, preferences and consent"}
      - {file: docs/sprints/sprint-03-screens/06-documents-number-shown.png, caption: "ID documents: masked until opened; every view is recorded"}
      - {file: docs/sprints/sprint-03-screens/09-waiter-no-documents.png, caption: "A waiter sees the guest but no ID documents"}
      - {file: docs/sprints/sprint-03-screens/11-anonymised.png, caption: "After anonymising: personal data and documents removed"}
      - {file: docs/sprints/sprint-03-screens/12-phone-profile.png, caption: "Guest profile at phone width", width: 2.4}
  scope:
    tables: [guests, guest_addresses, guest_documents, guest_preferences, guest_consents]
    migrations: [V005__guests]
    api:
      - GET|POST /api/v1/guests
