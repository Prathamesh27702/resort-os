name: Bug
description: Something doesn't work as documented
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: "Include the correlationId from the error if there is one. No real guest data or secrets." }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce, value: "1. \n2. \n3. " }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected }
    validations: { required: true }
  - type: dropdown
    id: env
    attributes: { label: Environment, options: [Development, Staging, Production] }
    validations: { required: true }
