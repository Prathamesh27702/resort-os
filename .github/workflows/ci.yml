# Continuous integration (brief §78): build → unit + integration tests → lint → security scan → artefacts.
# Deployment to staging/production is added in Sprint 29 (deploy.yml, GitHub Environments with approval).
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — build, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-throwaway   # ephemeral CI container, not a secret
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      RESORT_TEST_DB: Host=localhost;Port=5432;Database=resort_test;Username=ci;Password=ci-only-throwaway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
      - name: Restore
        run: dotnet restore ResortOS.sln
      - name: Build (warnings are errors)
        run: dotnet build ResortOS.sln -c Release --no-restore -warnaserror
      - name: Lint (dotnet format)
        run: dotnet format ResortOS.sln --verify-no-changes --no-restore
      - name: Test (unit + integration on PostgreSQL 16)
        run: dotnet test ResortOS.sln -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - name: Test summary (fail if no tests ran)
        if: always()
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          files = glob.glob("TestResults/*.trx")
          if not files:
              print("::error::No test results produced"); sys.exit(1)
          c = ET.parse(files[0]).getroot().find("t:ResultSummary/t:Counters", ns).attrib
          total, passed, failed = int(c["total"]), int(c["passed"]), int(c["failed"])
          print(f"::notice title=Backend tests::{passed} passed, {failed} failed, {total} total")
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"### Backend tests\n{passed} passed · {failed} failed · {total} total\n")
          sys.exit(1 if total == 0 or failed else 0)
          PY
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults
      - name: Publish API artefact
        if: github.event_name == 'push'
        run: dotnet publish backend/Resort.Api -c Release --no-build -o out/api
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: api
          path: out/api
          retention-days: 14

  frontend:
    name: Frontend — lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npx ng lint
      - name: Unit tests (headless Chrome)
        run: npm run test:ci
      - name: Production build
        run: npm run build:prod
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: web
          path: frontend/dist/resort-web/browser
          retention-days: 14

  backend-windows:
    # The owner and developers work on Windows. Some .NET behaviour differs there (e.g. time-zone names come from
    # ICU, so "IST" was accepted on Windows but not on Linux). Same tests, Windows runner, PostgreSQL preinstalled.
    name: Backend — tests on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      # The runner image's built-in PostgreSQL account (documented by GitHub), not a secret.
      RESORT_TEST_DB: Host=localhost;Port=5432;Database=resort_test;Username=postgres;Password=root
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Start PostgreSQL
        shell: pwsh
        run: |
          $svc = Get-Service -Name 'postgresql*' | Select-Object -First 1
          Set-Service -InputObject $svc -StartupType Automatic
          Start-Service -InputObject $svc
          & "$env:PGBIN\pg_isready.exe" -h localhost -p 5432
      - name: Test (unit + integration)
        run: dotnet test ResortOS.sln -c Release --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - name: Test summary (fail if no tests ran)
        if: always()
        shell: pwsh
        run: |
          $trx = Get-ChildItem TestResults/*.trx | Select-Object -First 1
          if (-not $trx) { Write-Output "::error::No test results produced"; exit 1 }
          $c = ([xml](Get-Content $trx.FullName)).TestRun.ResultSummary.Counters
          Write-Output "::notice title=Windows backend tests::$($c.passed) passed, $($c.failed) failed, $($c.total) total"
          if ([int]$c.total -eq 0 -or [int]$c.failed -gt 0) { exit 1 }
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-windows-test-results
          path: TestResults

  e2e:
    # Clicks through the staff app like a person: docs/sprints/REVIEWING.md scripts, automated (frontend/e2e).
    name: Browser tests — sprint review scripts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-throwaway   # ephemeral CI container, not a secret
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      RESORT_TEST_DB: Host=localhost;Port=5432;Database=resort_test;Username=ci;Password=ci-only-throwaway
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: One-off keys for this run (what scripts/setup-dev writes to .env on a PC)
        run: |
          echo "Jwt__SigningKey=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
          echo "Encryption__Key=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Browser tests
        run: npm run e2e
      - name: Upload report (screenshots of every step; traces for failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: frontend/e2e-report
          retention-days: 14

  migrations:
    name: Migrations — immutable and ordered
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Applied migrations must not change
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-status "origin/${{ github.base_ref }}...HEAD" -- database/migrations | grep -E '^(M|D|R)' || true)
          if [ -n "$changed" ]; then
            echo "::error::Existing migrations were modified/deleted/renamed. Add a new V###__*.sql instead."
            echo "$changed"; exit 1
          fi
      - name: Version numbers unique and well-formed
        run: |
          cd database/migrations
          bad=$(ls | grep -vE '^V[0-9]{3,}__[a-z0-9_]+\.sql$' || true)
          [ -z "$bad" ] || { echo "::error::Bad migration file names: $bad"; exit 1; }
          dups=$(ls | sed -E 's/__.*//' | sort | uniq -d)
          [ -z "$dups" ] || { echo "::error::Duplicate migration versions: $dups"; exit 1; }

  security:
    name: Security — secrets and vulnerable packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # gitleaks CLI over the whole git history (the gitleaks GitHub Action needs extra token permissions on
      # pull requests and failed on every PR). Same result on pushes and PRs, no token needed.
      - name: Secret scan (gitleaks, full history)
        env:
          GITLEAKS_VERSION: 8.24.2
        run: |
          curl -sSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose --exit-code 1
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Vulnerable NuGet packages
        run: |
          dotnet restore ResortOS.sln
          dotnet list ResortOS.sln package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then echo "::error::Vulnerable NuGet packages"; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vulnerable npm packages (runtime dependencies)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
